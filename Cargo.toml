[package]
name = "locus-tui"
version = "0.2.2"
edition = "2024"
rust-version = "1.97.1"
description = "A terminal genome browser for BAM files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bwbioinfo/locus"
keywords = ["genomics", "bioinformatics", "bam", "gtf", "gff"]
categories = ["science", "command-line-utilities"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/docs/captures/**",
    "/docs/images/**",
    "/examples/**",
    "/src/**",
]

[[bin]]
name = "locus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
noodles-bam = "0.92"
noodles-sam = "0.87"
noodles-core = "0.20"
noodles-bgzf = "0.49"
noodles-csi = "0.58"
noodles-tabix = "0.64"

[profile.release]
opt-level = 3
